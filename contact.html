<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me contacter - Sasmithan</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="contact.js"></script>
</head>

<body>

  <div class="bloc-contact">
    <svg class="icone-titre" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
      <path d="M3.5 6.5 12 13l8.5-6.5"/>
    </svg>
    <h1>Me contacter</h1>

    <p class="intro_texte">Une question, une opportunité d'alternance ou
      simplement envie d'échanger ? N'hésitez pas à m'écrire, je réponds
      rapidement.</p>

    <div class="carte-contact">
      <form id="formContact" class="form-contact">
        <div class="champ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"/>
          </svg>
          <input type="text" id="nom" name="nom" placeholder="Votre nom" required />
        </div>

        <div class="champ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
            <path d="M3.5 6.5 12 13l8.5-6.5"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="Votre email" required />
        </div>

        <div class="champ champ-message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 5.5h18v11H8.5L3 21z"/>
          </svg>
          <textarea id="message" name="message" placeholder="Votre message" rows="6" required></textarea>
        </div>

        <button type="submit" class="bouton-envoyer">
          Envoyer
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M21 3 3 10.5l7.5 3L14 21z"/>
            <path d="M21 3 10.5 13.5"/>
          </svg>
        </button>
      </form>
    </div>

    <a class="lien-retour" href="index.html">← Retour à l'accueil</a>
  </div>

</body>
</html>
