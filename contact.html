<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me contacter - Sasmithan</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="contact.js"></script>
</head>

<body>

  <div class="bloc-contact">
    <h1>Me contacter</h1>

    <p class="intro_texte">Une question, une opportunité d'alternance ou
      simplement envie d'échanger ? N'hésitez pas à m'écrire, je réponds
      rapidement.</p>

    <form id="formContact" class="form-contact">
      <input type="text" id="nom" name="nom" placeholder="Votre nom" required />
      <input type="email" id="email" name="email" placeholder="Votre email" required />
      <textarea id="message" name="message" placeholder="Votre message" rows="6" required></textarea>
      <button type="submit" class="bouton_bas">Envoyer</button>
    </form>

    <a class="bouton_bas" href="index.html">← Retour</a>
  </div>

</body>
</html>
